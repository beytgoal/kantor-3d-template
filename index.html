<!doctype html>
<!-- Kantor 3D — Template | Lisensi MIT (lihat LICENSE) | https://github.com/beytgoal/kantor-3d-template -->
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Kantor 3D Contoh</title>
<style>
  :root{
    --ink:#f2ede4;
    --ink-dim:#a79c8a;
    --panel:rgba(12,13,19,.78);
    --panel-line:rgba(255,255,255,.13);
    --amber:#f7b955;
  }
  html, body{ margin:0; height:100%; background:#05060a; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #hud{ position:fixed; top:14px; left:16px; z-index:10; pointer-events:none;
    text-shadow:0 1px 8px rgba(0,0,0,.9); }
  #hud h1{ font-size:17px; margin:0; letter-spacing:.14em; font-weight:700; }
  #hud p{ font-size:10px; margin:2px 0 0; color:var(--ink-dim);
    letter-spacing:.22em; text-transform:uppercase; }

  #bubbles{ position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
  .bubble{ position:absolute; left:0; top:0; max-width:168px; padding:4px 9px 5px;
    background:rgba(10,11,17,.82); border:1px solid rgba(255,255,255,.16);
    border-radius:10px; text-align:center; will-change:transform; }
  .bubble::after{ content:""; position:absolute; left:50%; bottom:-5px; width:9px; height:9px;
    background:inherit; border-right:1px solid rgba(255,255,255,.16);
    border-bottom:1px solid rgba(255,255,255,.16); transform:translateX(-50%) rotate(45deg); }
  .bubble b{ display:block; font-size:10.5px; line-height:1.25; letter-spacing:.02em; }
  .bubble span{ display:block; font-size:9.5px; line-height:1.3; color:#d9d2c4; margin-top:1px; }

  #chips{ position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:10;
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:94vw; }
  #chips button{ border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    font:500 12px system-ui,sans-serif; padding:7px 13px; border-radius:999px; cursor:pointer;
    backdrop-filter:blur(6px); }
  #chips button:hover{ border-color:var(--amber); }
  #chips button.on{ border-color:var(--amber); color:var(--amber); }

  #povBar{ position:fixed; right:14px; top:14px; z-index:10; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  #povBar .pov-label{ font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim); text-shadow:0 1px 6px #000; margin-right:2px; }
  #povBar button{ border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    font:500 11.5px system-ui,sans-serif; padding:6px 11px; border-radius:999px; cursor:pointer; backdrop-filter:blur(6px); }
  #povBar button:hover{ border-color:var(--amber); }
  #povBar button.on{ border-color:var(--amber); color:#0b0c10; background:var(--amber); font-weight:700; }
  #povBar button.exit{ display:none; }
  #povBar button.exit.show{ display:block; }
  @media (max-width:640px){ #povBar{ top:auto; bottom:118px; right:10px; } #povBar button{ font-size:11px; padding:5px 9px; } }

  #povHint{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10; display:none;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:999px;
    padding:6px 14px; font-size:11.5px; color:var(--ink); backdrop-filter:blur(6px);
    pointer-events:none; white-space:nowrap; }
  #povHint.show{ display:block; }
  #povHint b{ color:var(--amber); font-weight:600; }

  #musicBtn{ position:fixed; right:14px; bottom:14px; z-index:10;
    border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    font:500 13.5px system-ui,sans-serif; padding:12px 18px; min-height:48px; border-radius:999px; cursor:pointer;
    backdrop-filter:blur(6px); display:flex; align-items:center; gap:7px; }
  #musicBtn .note{ font-size:14px; line-height:1; }
  #musicBtn.on{ border-color:var(--amber); color:var(--amber); }
  #musicBtn.on .note{ animation:bob 0.9s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-2px) } }

  /* SATU tombol master hide/unhide: semua bubble agent + semua tombol
     ruangan (chips) sekaligus — visualisasi bersih tanpa tertutup. */
  #bubbleAllBtn{ position:fixed; left:16px; top:64px; z-index:10;
    border:1px solid var(--panel-line); background:var(--panel); color:var(--ink);
    font:500 12px system-ui,sans-serif; padding:8px 14px; min-height:40px; border-radius:999px; cursor:pointer;
    backdrop-filter:blur(6px); }
  #bubbleAllBtn:hover{ border-color:var(--amber); }
  #bubbleAllBtn[aria-pressed="true"]{ border-color:var(--amber); color:var(--amber); }

  #card{ position:fixed; left:14px; bottom:14px; z-index:11; width:272px; max-width:calc(100vw - 28px);
    background:var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    padding:14px 16px 13px; backdrop-filter:blur(8px); display:none; }
  #card.open{ display:block; }
  #card h3{ margin:0 24px 2px 0; font-size:15.5px; }
  #card .sub{ margin:0 0 7px; font-size:12px; color:var(--amber); }
  #card .body{ margin:0; font-size:13px; line-height:1.55; color:var(--ink); }
  #card .body .live{ color:var(--ink-dim); }
  #cardClose{ position:absolute; top:7px; right:10px; border:0; background:none;
    color:var(--ink-dim); font-size:19px; line-height:1; cursor:pointer; padding:3px 5px; }
  #cardClose:hover{ color:var(--ink); }

  #fallback{ position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center; }
  #fallback .fcard{ max-width:420px; background:var(--panel);
    border:1px solid var(--panel-line); border-radius:14px; padding:22px; }
  #fallback h2{ margin:0 0 8px; font-size:17px; }
  #fallback p{ margin:0; color:var(--ink-dim); font-size:14px; line-height:1.55; }

  @media (max-width:640px){
    #hud h1{ font-size:15px; }
    .bubble{ max-width:132px; padding:3px 7px 4px; }
    .bubble b{ font-size:9.5px; }
    .bubble span{ font-size:8.5px; }
    #chips{ bottom:60px; }
    #card{ bottom:110px; }
  }
  @media (prefers-reduced-motion: reduce){
    #musicBtn.on .note{ animation:none; }
  }
</style>
</head>
<body>

<div id="stage" aria-label="Kantor virtual 3D Contoh dua lantai"></div>
<div id="bubbles" aria-hidden="true"></div>

<div id="hud">
  <h1 id="coName">CONTOH</h1>
  <p>Kantor Virtual 3D</p>
</div>

<div id="povBar" aria-label="POV agent">
  <span class="pov-label">POV Agent</span>
  <!-- tombol POV di-generate dari CONFIG.agents -->
  <button id="povExit" class="exit">✕ Keluar POV</button>
</div>

<nav id="chips" aria-label="Lompat ke ruangan">
  <!-- tombol lompat di-generate dari CONFIG.divisions + CONFIG.floors -->
</nav>

<div id="povHint" aria-hidden="true">Mode POV — <b>seret layar</b> untuk melihat sekeliling</div>

<button id="musicBtn" aria-pressed="false"><span class="note">♪</span><span id="musicLabel">Musik kantor</span></button>

<button id="bubbleAllBtn" aria-pressed="false">Sembunyikan Bubble &amp; Ruangan</button>

<div id="card" role="dialog" aria-label="Detail objek">
  <button id="cardClose" aria-label="Tutup">&times;</button>
  <img id="cardFace" alt="" style="display:none;width:64px;height:64px;object-fit:cover;border-radius:50%;border:2px solid var(--amber);margin:0 0 8px;" />
  <h3 id="cardTitle"></h3>
  <p class="sub" id="cardSub"></p>
  <p class="body" id="cardBody"></p>
</div>

<div id="fallback">
  <div class="fcard">
    <h2>Kantor 3D tidak dapat dimuat</h2>
    <p>Peramban ini tidak mendukung WebGL atau pustaka 3D gagal dimuat. Coba buka lagi di peramban modern dengan koneksi internet.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   ★ KANTOR 3D — CONFIG ★
   Edit bagian ini saja untuk menyesuaikan dengan perusahaanmu —
   identitas, jumlah divisi/agen/lantai, DAN tampilan visual.
   Animasi dan layout 3D tidak perlu diubah.
   ============================================================ */
const CONFIG = {
  // ── Identitas perusahaan (contoh generik — ganti dengan punyamu) ──
  company: "Contoh",
  companyUpper: "CONTOH",
  domain: "contoh.id",
  appUrl: "app.contoh.id",
  // Jumlah lantai gedung (bawaan 3). Pelat lantai, tangga, dan tombol
  // lompat lantai dibangun otomatis mengikuti angka ini (minimal 1).
  // Gedung berbentuk gabungan PERSEGI + SILINDER: badan kotak menyatu
  // dengan menara silinder; dua tangga TIDAK sejajar (satu di badan
  // kotak, satu di menara).
  floors: 3,
  // Jumlah agent CADANGAN: agent standby fleksibel yang menunggu di
  // area bersama (lounge lantai 1) lalu berpindah membantu divisi yang
  // sibuk dan duduk di meja cadangan divisi itu. 0 = tanpa cadangan.
  reserves: 2,
  // ── Pipeline divisi ──
  //    Urutan divisi di bawah = urutan ruangan kiri → kanan di tiap lantai.
  //    Bebas tambah, hapus, atau susun ulang — ruangan, meja, kursi, dan
  //    tombol lompat dibangun otomatis. `floor` = lantai ruangan (1-index).
  //    `feature`: fitur khusus ruangan — "server" (rak server), "books"
  //    (rak buku + poster), "studio" (sudut studio), atau kosongkan untuk
  //    tanpa fitur (bawaan: divisi ke-1 server, ke-2 studio, ke-3 buku).
  //    `industry`: bidang industri divisi — dipakai teks status & kartu.
  //    `workflow`: langkah kerja divisi — dipakai teks status agen saat
  //    siklus kerja berjalan (boleh dikosongkan).
  //    `pipeline.source`: index divisi sumber data (default 0 = divisi
  //    pertama). Agen kurir membawa data dari divisi sumber ke divisi lain.
  pipeline: { source: 0 },
  divisions: [
    {
      short: "Operasional",
      full: "Divisi Operasional",
      room: "Ruang Operasional",
      floor: 1,
      color: 0xf7b955, css: "#f7b955", cssDark: "#b57a2e",
      url: "operasional.contoh.id",
      screen: "Operasional",
      board: "Papan Operasional",
      boardDesc: "Papan pantau operasional: tugas harian dan progres tim operasional.",
      roomDesc: "Ruang kerja tim operasional.",
      industry: "Jasa & Operasional",
      feature: "server",
      workflow: ["Siapkan data harian", "Cek progres tim", "Laporan ke direktur"]
    },
    {
      short: "Pemasaran",
      full: "Divisi Pemasaran",
      room: "Ruang Pemasaran",
      floor: 2,
      color: 0x6ea8ff, css: "#6ea8ff", cssDark: "#2e3a5c",
      url: "pemasaran.contoh.id",
      screen: "Pemasaran",
      board: "Papan Pemasaran",
      boardDesc: "Papan konsep pemasaran: jadwal konten dan ide promosi yang sedang digarap.",
      roomDesc: "Ruang kerja tim pemasaran.",
      industry: "Pemasaran Digital",
      feature: "studio",
      workflow: ["Susun konsep kampanye", "Garap materi promosi", "Jadwalkan tayang"]
    },
    {
      short: "Keuangan",
      full: "Divisi Keuangan",
      room: "Ruang Keuangan",
      floor: 3,
      color: 0x7bd88f, css: "#7bd88f", cssDark: "#6b7a52",
      url: "keuangan.contoh.id",
      screen: "Keuangan",
      board: "Papan Keuangan",
      boardDesc: "Papan pantau keuangan: arus kas, anggaran, dan laporan tim keuangan.",
      roomDesc: "Ruang kerja tim keuangan.",
      industry: "Keuangan",
      feature: "books",
      workflow: ["Cek arus kas", "Rekonsiliasi laporan", "Siapkan anggaran"]
    }
  ],
  // Tambah agen tinggal tambah entri di sini — ruangan, kursi, dan warna
  // dihitung otomatis. Field opsional per agen:
  //   id: pengenal unik (default: nama dijadikan slug)
  //   division: index divisi tempat ia duduk (0 = divisi pertama) atau
  //             nama pendek divisi (mis. "Operasional"); kalau dikosongkan,
  //             agen dibagi rata ke semua divisi (round-robin).
  //   desk: nomor kursi di ruangan divisinya (0 = kursi pertama); kalau
  //         dikosongkan, diambil kursi kosong berikutnya.
  //   color: warna bubble & aksen agen (default: warna divisinya)
  //   colorCss: warna baju agen (default: sama dengan `color`)
  //   face: foto wajah (data URI atau URL) — opsional; tanpa foto, agen
  //         memakai face mesh 3D bawaan. Lihat AGENT_STYLE di bawah.
  //   role "COO", "CEO", atau "Direktur" = agen utama yang mengoordinasi
  //         siklus kerja antar divisi.
  agents: [
    { id: "direktur", name: "Ayu", role: "COO", division: 0, desk: 1, color: "#ffd700", colorCss: "#e8b64c" },
    { id: "kepala-operasional", name: "Budi", role: "Kepala Divisi Operasional", division: 0, desk: 0 },
    { id: "staff-pemasaran", name: "Citra", role: "Staff Pemasaran", division: 1, desk: 1, color: "#ffb347", colorCss: "#4f8a94" },
    { id: "staff-keuangan", name: "Dedi", role: "Staff Keuangan", division: 2, desk: 1, color: "#ff8c42", colorCss: "#2e4a7a" },
    { id: "kepala-pemasaran", name: "Eka", role: "Kepala Divisi Pemasaran", division: 1, desk: 0, colorCss: "#2e3a5c" },
    { id: "kepala-keuangan", name: "Fajar", role: "Kepala Divisi Keuangan", division: 2, desk: 0, colorCss: "#6b7a52" }
  ],
  // ── Tampilan visual: warna, cahaya, kamera, dan tema panel UI ──
  //    Semua bisa diubah di sini tanpa menyentuh kode di bawah.
  //    `theme`: "malam" (bawaan — seperti demo), "siang", atau "senja".
  //    Field lain di `visual` MENIMPA tema yang dipilih, jadi tema
  //    bisa dipakai apa adanya atau dijadikan titik awal lalu
  //    disesuaikan per field. Hapus/kosongkan field untuk memakai
  //    nilai tema. Warna boleh hex number (0xffffff) atau string CSS
  //    ("#ffffff"). Contoh kustomisasi (hapus // di depannya):
  //      sky: 0x0a1428,                    // langit biru gelap
  //      camera: { fov: 52, position: [20, 16, 24] },
  //      palette: { wall: 0xf0e6d2, wood: 0x8a6a45 },
  //      ui: { amber: "#ff8c42" },
  visual: {
    theme: "malam"
  },
  // ── Musik latar (no-copyright) ──
  //    Trek bawaan: "Chill Lofi" oleh ZephiraMusic, lisensi Pixabay
  //    (gratis, boleh dipakai komersial, tanpa atribusi wajib).
  //    Ganti `src` dengan URL MP3 no-copyright lain, atau kosongkan
  //    ("") untuk memakai synth lo-fi generatif bawaan — tanpa file
  //    eksternal, tetap jalan offline. Bila trek gagal dimuat
  //    (mis. offline), synth dipakai otomatis sebagai fallback.
  music: {
    src: "https://cdn.pixabay.com/download/audio/2026/08/14/audio_a5f2abd4d3.mp3?filename=zephiramusic-chill-lofi-585360.mp3",
    title: "Chill Lofi — ZephiraMusic (Pixabay)",
    credit: "Musik: 'Chill Lofi' oleh ZephiraMusic, lisensi Pixabay"
  }
};
// --- derived & normalisasi (jangan diubah kecuali paham) ---
function slugName(n){ return String(n == null ? '' : n).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'agent'; }
(function(){
  // jumlah lantai: dari `floors`, tapi ikut membesar bila ada divisi di lantai lebih tinggi
  var NF = 2;
  if (typeof CONFIG.floors === 'number' && isFinite(CONFIG.floors) && CONFIG.floors >= 1) NF = Math.floor(CONFIG.floors);
  CONFIG.divisions.forEach(function(d){
    if (typeof d.floor !== 'number' || !isFinite(d.floor) || d.floor < 1) d.floor = 1;
    d.floor = Math.floor(d.floor);
    if (d.floor > NF) NF = d.floor;
  });
  CONFIG.floors = NF;
  CONFIG.divisions.forEach(function(d){ d.fullFloor = d.full + " \u2014 Lantai " + d.floor; });
  // pipeline: divisi sumber data (default 0 = divisi pertama)
  var PS = 0;
  if (CONFIG.pipeline && typeof CONFIG.pipeline.source === 'number' && isFinite(CONFIG.pipeline.source)) PS = Math.floor(CONFIG.pipeline.source);
  if (PS < 0 || PS >= CONFIG.divisions.length) PS = 0;
  CONFIG.pipeline = { source: PS };
  // agen cadangan: jumlah agent standby fleksibel (bawaan 2; 0 = tanpa)
  var RS = 2;
  if (typeof CONFIG.reserves === 'number' && isFinite(CONFIG.reserves) && CONFIG.reserves >= 0) RS = Math.floor(CONFIG.reserves);
  CONFIG.reserves = RS;
  // agen: id & divisi (index; boleh juga nama pendek divisi)
  CONFIG.agents.forEach(function(a, i){
    if (!a.id) a.id = slugName(a.name);
    var di = -1;
    if (typeof a.division === 'number' && isFinite(a.division)) di = Math.floor(a.division);
    else if (typeof a.division === 'string') {
      for (var k = 0; k < CONFIG.divisions.length; k++) {
        if (CONFIG.divisions[k].short.toLowerCase() === a.division.toLowerCase()) { di = k; break; }
      }
    }
    if (di < 0 || di >= CONFIG.divisions.length) di = CONFIG.divisions.length ? (i % CONFIG.divisions.length) : -1;
    a.division = di;
  });
})();
/* ── Tema visual bawaan ──────────────────────────────────────────
   Setiap tema berisi nilai lengkap untuk semua knop visual di bawah.
   `CONFIG.visual` menimpa tema yang dipilih (deep-merge per field),
   jadi tema bisa dipakai apa adanya atau dijadikan titik awal.
   Nilai tema "malam" = tampilan bawaan template (persis seperti demo).
   Warna boleh hex number (0xffffff) atau string CSS ("#ffffff"). */
var VISUAL_THEMES = {
  // Malam sinematik (bawaan): langit gelap, ruangan hangat menyala.
  malam: {
    sky: 0x05060a, fogNear: 34, fogFar: 78,
    camera: { fov: 46, position: [17, 14, 21], target: [0, 1.8, -0.5] },
    exposure: 1.12,
    ground: 0x07080d,
    stars: { color: 0x8899bb, size: 0.09, opacity: 0.55, count: 220 },
    lights: {
      ambient: { color: 0x2a3040, intensity: 0.55 },
      hemisphere: { sky: 0x35405a, ground: 0x0a0a0c, intensity: 0.5 },
      moon: { color: 0xbfd0ff, intensity: 0.22 },
      room: { warm: 0xffe3b3, warmMix: 0.5, intensity: 1.0, distance: 14 },
      stair: { color: 0xffc98a, intensity: 0.95, distance: 11 }
    },
    palette: {
      slab: 0xcfc8ba, wood: 0xcfa878, wall: 0xece7dd, wallSide: 0xe2dccd,
      dark: 0x22262d, metal: 0x3a3f45, white: 0xf5f2ea,
      glass: 0x16233a, glassGlow: 0x0e1a2e,
      leaf: 0x3e8e4f, pot: 0xa8542f, deskTop: 0xe8e2d4, deskLeg: 0x4a4f57,
      screen: 0x101318, panelLight: 0xfff4dc, panelLightGlow: 0xffe9bb
    },
    ui: {
      ink: "#f2ede4", inkDim: "#a79c8a",
      panel: "rgba(12,13,19,.78)", panelLine: "rgba(255,255,255,.13)",
      amber: "#f7b955"
    }
  },
  // Siang terang: langit biru, cahaya matahari, tanpa bintang.
  siang: {
    sky: 0x9fc5e8, fogNear: 40, fogFar: 95,
    camera: { fov: 46, position: [17, 14, 21], target: [0, 1.8, -0.5] },
    exposure: 1.0,
    ground: 0x4a5d3a,
    stars: { color: 0xffffff, size: 0.09, opacity: 0, count: 220 },
    lights: {
      ambient: { color: 0xfff2dd, intensity: 0.85 },
      hemisphere: { sky: 0xbfd9ff, ground: 0x8a7a5a, intensity: 0.75 },
      moon: { color: 0xfff1c4, intensity: 0.9 },
      room: { warm: 0xfff2d0, warmMix: 0.5, intensity: 0.6, distance: 14 },
      stair: { color: 0xffe9bb, intensity: 0.6, distance: 11 }
    },
    palette: {
      slab: 0xcfc8ba, wood: 0xcfa878, wall: 0xece7dd, wallSide: 0xe2dccd,
      dark: 0x22262d, metal: 0x3a3f45, white: 0xf5f2ea,
      glass: 0x16233a, glassGlow: 0x0e1a2e,
      leaf: 0x3e8e4f, pot: 0xa8542f, deskTop: 0xe8e2d4, deskLeg: 0x4a4f57,
      screen: 0x101318, panelLight: 0xfff4dc, panelLightGlow: 0xffe9bb
    },
    ui: {
      ink: "#f2ede4", inkDim: "#a79c8a",
      panel: "rgba(12,13,19,.78)", panelLine: "rgba(255,255,255,.13)",
      amber: "#f7b955"
    }
  },
  // Senja: langit ungu gelap, cahaya oranye hangat.
  senja: {
    sky: 0x2a1a2e, fogNear: 34, fogFar: 78,
    camera: { fov: 46, position: [17, 14, 21], target: [0, 1.8, -0.5] },
    exposure: 1.15,
    ground: 0x14101a,
    stars: { color: 0xffd9a0, size: 0.09, opacity: 0.4, count: 220 },
    lights: {

  function buildStairFlight(k) {
    var stairGroup = new THREE.Group();
    stairGroup.position.y = k * FH;
    building.add(stairGroup);
    for (var i = 0; i < 14; i++) {
      var topY = (i + 1) * 0.3, sx = -8.8 + i * 0.58 + 0.29;
      box(stairGroup, 0.58, topY, 2.7, stepMat, sx, topY / 2, -6.1);
      box(stairGroup, 0.6, 0.035, 2.74, treadMat, sx, topY + 0.017, -6.1);
      if (i % 3 === 0) { // lampu anak tangga
        box(stairGroup, 0.1, 0.05, 0.3, panelLightMat(), sx, topY - 0.12, -4.68);
      }
    }
    // railing tangga (sisi terbuka)
    (function rail() {
      var ang = Math.atan2(FH, 8.12), len = Math.hypot(8.12, FH) + 0.4;
      var r = box(stairGroup, len, 0.07, 0.07, MAT.metal, -4.74, FH / 2 + 0.98, -4.68);
      r.rotation.z = ang;
      [1, 4, 7, 10, 13].forEach(function (s) {
        var bx = -8.8 + s * 0.58 + 0.29, by = (s + 1) * 0.3;
        box(stairGroup, 0.05, 0.95, 0.05, MAT.metal, bx, by + 0.47, -4.68);
      });
      // pagar balkon di bukaan lantai atas
      box(stairGroup, 8.05, 0.06, 0.06, MAT.metal, -4.78, FH + 0.95, -4.52);
      for (var px = -8.7; px <= -0.85; px += 0.98) {
        box(stairGroup, 0.05, 0.95, 0.05, MAT.metal, px, FH + 0.47, -4.52);
      }
      box(stairGroup, 0.06, 0.06, 3.9, MAT.metal, -8.86, FH + 0.95, -6.42);
      for (var pz = -8.2; pz <= -4.7; pz += 0.9) {
        box(stairGroup, 0.05, 0.95, 0.05, MAT.metal, -8.86, FH + 0.47, pz);
      }
    })();
    clickable(stairGroup, { title: 'Tangga Utama', sub: 'Penghubung Lantai ' + (k + 1) + ' ↔ Lantai ' + (k + 2),
      body: 'Tangga kayu terang dengan lampu anak tangga — jalur para kurir naik-turun mengantar data antar divisi.' });
    return stairGroup;
  }
  for (var fl = 0; fl < NFLOORS - 1; fl++) buildStairFlight(fl);

  /* Tangga B — di dalam menara silinder (sisi timur), melayani flight
     lantai 2 ke atas (k = 1..NFLOORS-2). Arah naik ke UTARA (z
     mengecil), tegak lurus Tangga A yang naik ke timur di badan
     kotak — keduanya TIDAK sejajar dan tidak menumpuk segaris. */
  function buildStairFlightB(k) {
    var g = new THREE.Group();
    g.position.y = k * FH;
    building.add(g);
    for (var i = 0; i < 14; i++) {
      var topY = (i + 1) * 0.3, cz = 4.8 - i * 0.6246;
      box(g, 2.6, topY, 0.62, stepMat, TCX + 2.8, topY / 2, cz);
      box(g, 2.64, 0.035, 0.64, treadMat, TCX + 2.8, topY + 0.017, cz);
      if (i % 3 === 0) { // lampu anak tangga
        box(g, 0.3, 0.05, 0.1, panelLightMat(), TCX + 1.62, topY - 0.12, cz);
      }
    }
    // railing sisi terbuka (menghadap pusat menara)
    var r = box(g, 0.07, 0.07, Math.hypot(8.12, FH) + 0.4, MAT.metal, TCX + 1.55, FH / 2 + 0.98, 0.74);
    r.rotation.x = -Math.atan2(FH, 8.12);
    [1, 4, 7, 10, 13].forEach(function (s) {
      box(g, 0.05, 0.95, 0.05, MAT.metal, TCX + 1.55, (s + 1) * 0.3 + 0.47, 4.8 - s * 0.6246);
    });
    clickable(g, { title: 'Tangga Menara', sub: 'Penghubung Lantai ' + (k + 1) + ' ↔ Lantai ' + (k + 2),
      body: 'Tangga kedua di dalam menara silinder, naik ke arah utara — sengaja tidak sejajar dengan tangga utama di badan kotak.' });
    return g;
  }
  for (var fb = 1; fb < NFLOORS - 1; fb++) buildStairFlightB(fb);

  // dekorasi bawah tangga: tumpukan boks arsip + tanaman
  box(building, 0.7, 0.5, 0.7, M(0x9c8465), -5.6, 0.25, -6.2);
  box(building, 0.55, 0.4, 0.55, M(0x8a7454), -5.6, 0.7, -6.2);

  /* ── Tekstur prosedural: kain halus untuk tubuh agent ─────────── */
  function hexRGB(hex){ return [(hex>>16)&255,(hex>>8)&255,hex&255]; }
  function fabricTexture(hex, dark){
    var c=document.createElement('canvas'); c.width=c.height=256; var x=c.getContext('2d');
    var rgb=hexRGB(hex); x.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')'; x.fillRect(0,0,256,256);
    for(var i=0;i<256;i+=3){ x.fillStyle='rgba(255,255,255,'+(0.03+((i*7)%5)*0.008)+')'; x.fillRect(0,i,256,1); x.fillRect(i,0,1,256); }
    for(var j=0;j<2600;j++){ var a=Math.random()*0.055; x.fillStyle=(j%2?'rgba(0,0,0,':'rgba(255,255,255,')+a+')'; x.fillRect(Math.random()*256,Math.random()*256,1.6,1.6); }
    if(dark){ x.fillStyle='rgba(0,0,0,0.10)'; x.fillRect(0,0,256,256); }
    var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t;
  }
  function fabricMat(hex, rough){
    return new THREE.MeshStandardMaterial({ map:fabricTexture(hex), roughness:rough||0.92, metalness:0.02 });
  }
  function skinMat(hex){
    var c=document.createElement('canvas'); c.width=c.height=128; var x=c.getContext('2d');
    var rgb=hexRGB(hex); x.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')'; x.fillRect(0,0,128,128);
    for(var j=0;j<900;j++){ x.fillStyle='rgba('+(Math.random()<0.5?'255,220,190':'120,70,40')+','+(Math.random()*0.05)+')'; x.fillRect(Math.random()*128,Math.random()*128,2,2); }
    var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return new THREE.MeshStandardMaterial({ map:t, roughness:0.55, metalness:0.0 });
  }

  /* ── Layar browser hidup untuk monitor meja ───────────────────── */
  var browserScreens=[];
  function drawBrowser(cv, accentCss, url, title, tick){
    var x=cv.getContext('2d'), W=cv.width, H=cv.height;
    x.fillStyle='#f4f5f7'; x.fillRect(0,0,W,H);
    // toolbar browser
    x.fillStyle='#dee1e6'; x.fillRect(0,0,W,64);
    x.fillStyle='#fff'; x.beginPath(); x.moveTo(86,64); x.lineTo(86,28); x.quadraticCurveTo(86,16,98,16); x.lineTo(238,16); x.quadraticCurveTo(250,16,250,28); x.lineTo(254,64); x.closePath(); x.fill();
    x.fillStyle='#202124'; x.font='600 15px system-ui,sans-serif'; x.fillText(title,100,42);
    ['#ff5f57','#febc2e','#28c840'].forEach(function(col,i){ x.fillStyle=col; x.beginPath(); x.arc(22+i*24,26,7,0,7); x.fill(); });
    x.fillStyle='#fff'; roundRect(x,74,34,W-96,26,13); x.fill();
    x.fillStyle='#5f6368'; x.font='14px system-ui,sans-serif'; x.fillText('\uD83D\uDD12  '+url,92,52);
    // konten halaman
    x.fillStyle=accentCss; x.fillRect(0,64,W,44);
    x.fillStyle='#fff'; x.font='700 19px system-ui,sans-serif'; x.fillText(title+' — ' + CONFIG.company,16,92);
    x.fillStyle='#e8eaed'; x.fillRect(0,108,104,H-108);
    for(var i=0;i<5;i++){ x.fillStyle=i=== (tick%5)?accentCss:'#c9ccd1'; roundRect(x,12,126+i*34,80,18,6); x.fill(); }
    var scroll=(tick*14)%60;
    for(var r=0;r<4;r++){ x.fillStyle='#fff'; roundRect(x,118,124+r*46-scroll*0.2,376,36,7); x.fill();
      x.fillStyle='#dadce0'; roundRect(x,130,136+r*46-scroll*0.2,180+((r*53)%120),9,4); x.fill();
      x.fillStyle=accentCss; roundRect(x,130,152+r*46-scroll*0.2,52,7,3); x.fill(); }
    // grafik kecil
    x.strokeStyle=accentCss; x.lineWidth=3; x.beginPath();
    for(var gx=0;gx<=6;gx++){ var px=330+gx*26, py=286-((gx*37+tick*11)%54); if(gx===0)x.moveTo(px,py); else x.lineTo(px,py); } x.stroke();
    x.fillStyle='#3c4043'; x.font='12px system-ui,sans-serif'; x.fillText('Live • '+new Date().toLocaleTimeString('id-ID'),16,H-10);
  }
  function roundRect(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }
  function browserTexture(accentHex, url, title){
    var cv=document.createElement('canvas'); cv.width=512; cv.height=320;
    var accentCss='#'+('000000'+accentHex.toString(16)).slice(-6);
    var rec={cv:cv, accentCss:accentCss, url:url, title:title, tick:Math.floor(Math.random()*9)};
    drawBrowser(cv,accentCss,url,title,rec.tick);
    var tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=4;
    rec.tex=tex; browserScreens.push(rec); return tex;
  }
  setInterval(function(){ browserScreens.forEach(function(r){ r.tick++; drawBrowser(r.cv,r.accentCss,r.url,r.title,r.tick); r.tex.needsUpdate=true; }); },1600);

  /* ── Pembangun ruangan data-driven dari CONFIG ───────────────────
     Tiap ruangan divisi: karpet + meja (grid 2 kolom) + papan tulis +
     tanaman + satu fitur khusus menurut index divisi (0 = rak server,
     1 = rak buku + poster, 2 = sudut studio). Lounge: meja meeting +
     sofa + lampu lantai + boombox + tanaman. */
  var boombox = null, eqBars = [], notes = [];

  // grid meja per ruangan: 2 kolom, baris menyesuaikan jumlah agen
  // (satu meja ekstra di luar jumlah agen = MEJA CADANGAN untuk agent cadangan)
  function deskGrid(room) {
    if (room.kind === 'cyl') return deskGridCyl(room);
    var n = Math.max(4, room.agentCount + 1);
    var rows = Math.ceil(n / 2);
    var w = room.x1 - room.x0, colX;
    if (w < 7) colX = [room.x0 + w * 0.3, room.x0 + w * 0.7];
    else if (room.cx < 0) colX = [room.x0 + 2.4, room.x0 + 5.8];
    else colX = [room.x1 - 5.4, room.x1 - 2.2];
    var desks = [];
    for (var r = 0; r < rows; r++) {
      var z = (r - (rows - 1) / 2) * 3.6 + 1.8;
      for (var c = 0; c < 2; c++) {
        if (desks.length >= n) break;
        desks.push({ x: colX[c], z: z, sdx: 0, sdz: 1.15 });
      }
    }
    return desks;
  }
  // grid meja ruangan menara silinder: baris mengikuti tali busur (chord)
  function deskGridCyl(room) {
    var n = Math.max(4, room.agentCount + 1);
    var desks = [];
    var rowZ = [-3.6, -0.8, 2.0, 4.6];
    for (var r = 0; r < rowZ.length && desks.length < n; r++) {
      var z = rowZ[r];
      var half = Math.sqrt(Math.max(1, TR * TR - z * z)) - 1.6;
      var xs = [TCX - half + 1.1, TCX + half - 1.1];
      for (var c = 0; c < 2 && desks.length < n; c++) {
        desks.push({ x: xs[c], z: z, sdx: 0, sdz: 1.15 });
      }
    }
    while (desks.length < n) desks.push({ x: TCX, z: -0.8 + (desks.length % 3) * 0.5, sdx: 0, sdz: 1.15 });
    return desks;
  }
  function solidBackX(room, count) {
    var ranges = [[room.x0 + 0.9, room.x1 - 0.9]];
    if (room.floor > 0) { // lantai atas: lubang tangga x[-8.8,-0.7]
      ranges = [];
      var a0 = room.x0 + 0.9, a1 = room.x1 - 0.9;
      if (a0 < -8.8) ranges.push([a0, Math.min(a1, -8.8)]);
      if (a1 > -0.7) ranges.push([Math.max(a0, -0.7), a1]);
    }
    ranges = ranges.filter(function (rg) { return rg[1] - rg[0] >= 1.7; });
    if (!ranges.length) return [];
    var rg = ranges[0];
    var out = [];
    for (var i = 0; i < count; i++) {
      out.push(rg[0] + (rg[1] - rg[0]) * (i + 0.5) / count);
    }
    return out;
  }

  function buildDivisionRoom(room) {
    var div = room.div, topY = room.baseY;
    room.desks = deskGrid(room);
    room.desksTaken = room.desks.map(function () { return false; });
    // meja cadangan (meja pertama di luar milik agen tetap) untuk agent cadangan
    room.helpSeat = room.desks.length > room.agentCount
      ? { x: room.desks[room.agentCount].x + (room.desks[room.agentCount].sdx || 0),
          z: room.desks[room.agentCount].z + (room.desks[room.agentCount].sdz || 0),
          floor: room.floor }
      : null;
    room.helpTaken = false;
    // karpet zona
    var rugMesh = rug(room.cx, 1.6, (room.x1 - room.x0) - 2.6, 11.6, shadeHex(div.color, 0.62), topY);
    clickable(rugMesh, { title: div.room, sub: div.fullFloor, body: div.roomDesc });
    // meja kerja
    room.desks.forEach(function (dk) { deskUnit(dk.x, dk.z, topY, div); });
    // papan tulis di belakang ruangan
    whiteboard(room.cx, -4.18, topY, 0, div.color, div.board, div.fullFloor, div.boardDesc);
    // tanaman di sudut ruangan
    plant(building, room.x0 + 0.8, topY, 6.9, 1.1);
    plant(building, room.x1 - 0.8, topY, 6.9, 1.0);
    plant(building, room.x0 + 0.7, topY, -4.0, 0.9);
    // fitur khusus per divisi: dari `div.feature`; bawaan menurut index
    // (0 = rak server, 1 = rak buku + poster, 2 = sudut studio)
    var feat = div.feature || (room.divIndex === 0 ? 'server' : room.divIndex === 1 ? 'books' : room.divIndex === 2 ? 'studio' : 'none');
    if (feat === 'server') {
      // rak server di dinding kiri
      var serverGroup = new THREE.Group();
      serverGroup.position.set(room.x0 + 0.85, topY, -1.1);
      building.add(serverGroup);
      [-1.3, 0, 1.3].forEach(function (dz, ri) {
        box(serverGroup, 0.55, 2.0, 1.1, MAT.dark, 0, 1.0, dz);
        for (var r2 = 0; r2 < 5; r2++) {
          box(serverGroup, 0.03, 0.16, 0.9, M(0x31363f), 0.29, 0.3 + r2 * 0.36, dz);
          var led = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.07),
            M(0x0d2b1a, { emissive: 0x69f0ae, emissiveIntensity: 1.3 }));
          led.position.set(0.31, 0.38 + r2 * 0.36, dz - 0.32);
          led.rotation.y = Math.PI / 2;
          serverGroup.add(led);
          blinkers.push({ mat: led.material, seed: ri * 3 + r2 * 1.7 });
        }
      });
      clickable(serverGroup, { title: 'Rak Server', sub: 'Infrastruktur ' + div.full,
        body: 'Tiga rak server tempat data dikumpulkan dan diproses sebelum dipakai tim.' });
    } else if (feat === 'books') {
      bookshelf(room.x0 + 0.55, 0.6, topY, Math.PI / 2, div);
      // poster berdiri bebas (easel) — hanya di lantai yang padat
      solidBackX(room, 2).forEach(function (ex, ei) {
        var eg = new THREE.Group(); eg.position.set(ex, topY, -6.6); building.add(eg);
        var pcol = [0xc2504a, 0xe0a83c][ei % 2];

  var bubbleWrap = document.getElementById('bubbles');
  // status tombol master hide/unhide (bubble + ruangan) - diatur handler tombol di bawah

  /* Patch wajah: potongan bola (radius sedikit di atas kepala) yang memeluk
     permukaan kepala di sisi depan (+Z), bertekstur foto wajah agent dengan
     tepi elips transparan bergradasi. Sengaja BUKAN peta equirect di bola
     kepala: patch ini selalu tampil tepat di wajah dari sudut pandang mana
     pun, tidak tertutup bola rambut, dan tidak bergantung pada material
     dasar kepala. */
  function buildFacePatch(def){
    if(!def.face) return null;
    var geo = new THREE.SphereGeometry(0.217, 28, 20,
      Math.PI/2 - 0.62, 1.24,   // phi: rentang ±35.5° mengelilingi +Z
      0.62, 1.73);              // theta: 35.5°..134.6° dari kutub atas
    var mat = new THREE.MeshStandardMaterial({
      transparent: true, depthWrite: false, roughness: 0.5, metalness: 0 });
    var patch = new THREE.Mesh(geo, mat);
    patch.position.set(0, 1.68, 0);
    patch.renderOrder = 3;
    var img = new Image();
    img.onload = function(){
      try{
        var S=256, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
        var x=cv.getContext('2d');
        var cr=def.faceCrop;
        var dx=26, dy=72, dw=204, dh=158; // posisi wajah di kanvas patch
        x.save();
        x.beginPath(); x.ellipse(S/2, dy+dh/2, dw/2, dh/2, 0, 0, Math.PI*2); x.clip();
        x.drawImage(img, cr.x*img.width, cr.y*img.height, cr.w*img.width, cr.h*img.height, dx, dy, dw, dh);
        x.restore();
        // lunakkan tepi elips: fade radial tipis di pinggir patch
        x.globalCompositeOperation='destination-out';
        var g=x.createRadialGradient(S/2,dy+dh/2,dh*0.40, S/2,dy+dh/2,dh*0.52);
        g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
        x.fillStyle=g; x.fillRect(0,0,S,S);
        x.globalCompositeOperation='source-over';
        var tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8;
        mat.map=tex; mat.needsUpdate=true;
      }catch(e){}
    };
    img.onerror = function(){ patch.visible=false; };
    img.src = def.face;
    return patch;
  }

  /* Face mesh 3D prosedural: mata, alis, hidung, dan mulut dari geometri
     di permukaan depan kepala (+Z). Dipakai bila agen TIDAK punya foto
     (`def.face` kosong); bila ada foto, yang dipakai patch foto
     (buildFacePatch). Kepala: bola r=0.21 di (0, 1.68, 0). */
  function buildFaceMesh(def) {
    var g = new THREE.Group();
    var eyeMat = M(0x1a1512, { roughness: 0.35 });
    var browMat = M(def.hair, { roughness: 1 });
    var noseMat = M(shadeHex(def.skin, 0.82), { roughness: 0.7 });
    var mouthMat = M(0x7a3b2e, { roughness: 0.6 });
    [-0.072, 0.072].forEach(function (ex) {
      var eye = new THREE.Mesh(new THREE.SphereGeometry(0.024, 12, 10), eyeMat);
      eye.position.set(ex, 1.705, 0.192);
      g.add(eye);
      var brow = box(g, 0.07, 0.012, 0.012, browMat, ex, 1.752, 0.182);
      brow.rotation.z = ex < 0 ? 0.08 : -0.08;
    });
    var nose = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.05, 10), noseMat);
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, 1.66, 0.205);
    g.add(nose);
    box(g, 0.075, 0.014, 0.012, mouthMat, 0, 1.612, 0.196);
    return g;
  }

  function buildAgentMesh(def) {
    var g = new THREE.Group();
    var inner = new THREE.Group();
    g.add(inner);
    var skin = skinMat(def.skin);
    var cloth = fabricMat(parseInt(def.colorCss.replace('#',''),16), 0.94);
    var pants = fabricMat(0x2f3540, 1);
    var shoe = M(0x1d1f24, { roughness: 0.6 });

    function limb(parent, x, y, w, h, d, mat) {
      var pivot = new THREE.Group();
      pivot.position.set(x, y, 0);
      var m = box(pivot, w, h, d, mat, 0, -h / 2, 0);
      m.geometry = new THREE.BoxGeometry(w, h, d);
      parent.add(pivot);
      return pivot;
    }
    // kaki dua segmen berengsel lutut: paha (pivot di pinggul) + betis
    // (pivot anak di lutut) - memungkinkan pose DUDUK di kursi meja:
    // paha horizontal ke depan, betis vertikal turun sampai sepatu di lantai.
    function leg(x) {
      var thigh = limb(inner, x, 0.86, 0.15, 0.42, 0.17, pants);
      var shin = new THREE.Group();
      shin.position.set(0, -0.42, 0);
      thigh.add(shin);
      box(shin, 0.13, 0.42, 0.15, pants, 0, -0.21, 0);
      box(shin, 0.16, 0.07, 0.26, shoe, 0, -0.42, 0.04);
      return { thigh: thigh, shin: shin };
    }
    var legLO = leg(-0.11), legRO = leg(0.11);
    var legL = legLO.thigh, legR = legRO.thigh;
    // leher + torso kain bertekstur + bahu membulat (lebih halus)
    cyl(inner, 0.075, 0.085, 0.14, skin, 0, 1.47, 0, 16);
    box(inner, 0.5, 0.6, 0.3, cloth, 0, 1.14, 0); // torso
    var shL = new THREE.Mesh(new THREE.SphereGeometry(0.095, 18, 14), cloth); shL.position.set(-0.27, 1.40, 0); inner.add(shL);
    var shR = shL.clone(); shR.position.x = 0.27; inner.add(shR);
    box(inner, 0.52, 0.07, 0.32, cloth, 0, 1.42, 0);
    if (def.skirt) { // rok untuk agent perempuan (COO)
      var sk = cyl(inner, 0.24, 0.4, 0.34, cloth, 0, 0.72, 0, 24);
      sk.position.y = 0.72;
    }
    var armL = limb(inner, -0.32, 1.4, 0.13, 0.6, 0.15, cloth);
    var armR = limb(inner, 0.32, 1.4, 0.13, 0.6, 0.15, cloth);
    box(armL, 0.11, 0.09, 0.13, skin, 0, -0.62, 0);
    box(armR, 0.11, 0.09, 0.13, skin, 0, -0.62, 0);
    // kepala halus 32x24 segmen + wajah: foto bila ada, face mesh bila tidak
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 32, 24), skin);
    head.position.set(0, 1.68, 0); inner.add(head);
    var facePatch = buildFacePatch(def);
    if (facePatch) inner.add(facePatch);
    else inner.add(buildFaceMesh(def));
    var hair = new THREE.Mesh(new THREE.SphereGeometry(0.228, 32, 24), fabricMat(def.hair, 1));
    hair.scale.set(1, 0.78, 1);
    hair.position.set(0, 1.80, -0.04); inner.add(hair);
    if (def.hairStyle === 'long') {
      box(inner, 0.42, 0.52, 0.13, fabricMat(def.hair, 1), 0, 1.42, -0.17);
    }
    // paket data
    var pack = new THREE.Group();
    box(pack, 0.36, 0.27, 0.25, M(0xfdfdf8), 0, 0, 0);
    box(pack, 0.37, 0.06, 0.26, M(0xc9a227, { emissive: 0xc9a227, emissiveIntensity: 0.3 }), 0, 0.05, 0);
    pack.position.set(0, 1.08, 0.36);
    pack.visible = false;
    inner.add(pack);

    g.userData.parts = { inner: inner, legL: legL, legR: legR, shinL: legLO.shin, shinR: legRO.shin, armL: armL, armR: armR, pack: pack };
    scene.add(g);
    return g;
  }

  function mkAgent(def) {
    var mesh = buildAgentMesh(def);
    mesh.position.set(def.seat.x, def.seat.floor * FH, def.seat.z);
    var el = document.createElement('div');

    var a = {
      id: def.id, name: def.name, role: def.role, color: def.color,
      divIndex: def.divIndex, homeFloor: def.seat.floor, seat: def.seat,
      seatSpot: { x: def.seat.x, z: def.seat.z, floor: def.seat.floor }, lastSpot: null,
      mesh: mesh, parts: mesh.userData.parts, bubbleEl: el,
      bubbleName: el.querySelector('b'), bubbleText: el.querySelector('span'),
      face: def.face || null,
      pos: mesh.position, path: [], walkPhase: Math.random() * 6,
      moving: false, carrying: false, status: 'Bekerja di meja',
      idleAngle: Math.PI, facePoint: null, lastStatus: '',
      wantSeat: true, sitting: false, wfIdx: 0, idleTimer: Math.random() * 8
    };
    clickable(mesh, { agent: a, title: def.name, sub: def.role, body: '' });
    a.lastSpot = a.seatSpot;

  }

  /* ── Gaya visual per agent (foto wajah, rambut, kulit) ───────────
     Dipisah dari CONFIG supaya blok CONFIG tetap ringkas. Kunci = id
     agent. Agent baru tanpa entri di sini memakai default (tanpa foto
     wajah, rambut pendek, kulit standar). */
  // ── Gaya agen (opsional): rambut, warna kulit, gaya rambut, rok ──
  // Template ini TIDAK menyertakan foto wajah — agen memakai face mesh 3D
  // bawaan (mata, alis, hidung, mulut dari geometri). Untuk memakai foto
  // sendiri, tambah field `face` di entri agen CONFIG (data URI / URL),
  // atau isi satu entri di sini per `id` agen:
  //   'nama-id': { face: 'data:image/webp;base64,...', faceCrop: { x: 0.3, y: 0.3, w: 0.4, h: 0.4 }, hair: 0x1c1a17, hairStyle: 'long', skin: 0xf6d7b8, skirt: true },
  var AGENT_STYLE = {
    'direktur': { hair: 0x1c1a17, hairStyle: 'long', skin: 0xf6d7b8, skirt: true },
    'kepala-operasional': { hair: 0x2b2b2e, hairStyle: 'short', skin: 0xd99e6a },
    'staff-pemasaran': { hair: 0x1c1a17, hairStyle: 'long', skin: 0xf0bd8e },
    'staff-keuangan': { hair: 0x22201e, hairStyle: 'short', skin: 0xeebd96 },
    'kepala-pemasaran': { hair: 0x23283b, hairStyle: 'short', skin: 0xeebd96 },
    'kepala-keuangan': { hair: 0x22201e, hairStyle: 'short', skin: 0xeebd96 }
  };

  // Ambil satu kursi di ruangan: `wantIdx` bila masih kosong, kalau tidak kursi kosong pertama.
  function takeSeat(room, wantIdx) {
    if (!room || !room.desks || !room.desks.length) return null;
    var idx = -1;
    if (typeof wantIdx === 'number' && wantIdx >= 0 && wantIdx < room.desks.length && !room.desksTaken[wantIdx]) idx = wantIdx;
    if (idx < 0) { for (var i = 0; i < room.desks.length; i++) { if (!room.desksTaken[i]) { idx = i; break; } } }
    if (idx < 0) return null;
    room.desksTaken[idx] = true;
    var dk = room.desks[idx];

  /* ── Agent cadangan (CONFIG.reserves) ────────────────────────────

  var reserveRoundRobin = 0;

  /* ── Rute antar ruangan & antar lantai (lewat tangga) ──────────── */

        if (!usedVia && (cur.z > 2 || p.z > 2)) push({ x: -8.6, z: 5.3 }, 0);
        if (inCylPt(p) && !inCylPt(cur)) push({ x: TCX + 4.7, z: 4.2 }, 0);
        push(p, 0);
      } else {

        if (curIn && !pIn) { push({ x: TCX + 5.9, z: -2.0 }, f); push({ x: p.x, z: -3.2 }, f); }
        else if (!curIn && pIn) { if (Math.abs(cur.z + 3.2) > 0.35) push({ x: cur.x, z: -3.2 }, f); push({ x: TCX + 5.9, z: -2.0 }, f); }
        else if (curIn && pIn) { if ((cur.z > 0) !== (p.z > 0)) push({ x: TCX + 5.9, z: -2.0 }, f); }
        else { if (Math.abs(cur.z + 3.2) > 0.35) push({ x: cur.x, z: -3.2 }, f); if (Math.abs(p.z + 3.2) > 0.35) push({ x: p.x, z: -3.2 }, f); }
        push(p, f);

        if (useB) { walkTo(B_ENTRY, cur.floor); stairBUp(lo).forEach(function (w) { push(w); }); cur = { x: B_EXIT.x, z: B_EXIT.z, floor: nf }; }
        else { walkTo(A_ENTRY, cur.floor); stairUp(lo).forEach(function (w) { push(w); }); push(landPoint(nf), nf); cur = { x: A_EXIT.x, z: A_EXIT.z, floor: nf }; }
      } else {

  /* ── Titik aktivitas ────────────────────────────────────────────── */

  var srcRoom = roomOfDivision(CONFIG.pipeline.source) || roomsByFloor[0][0];
  var SPOTS = (srcRoom.kind === 'cyl') ? {

    board: { x: srcRoom.cx - 0.2, z: -3.15, floor: srcRoom.floor, via: [{ x: srcRoom.x0 + 4.1, z: 1.15 }, { x: srcRoom.cx - 3.2, z: -3.15 }] },
    server: { x: srcRoom.x0 + 1.95, z: -1.8, floor: srcRoom.floor, via: [{ x: srcRoom.x0 + 4.1, z: 1.15 }, { x: srcRoom.x0 + 4.1, z: -1.8 }] }

  /* ── Koreografi siklus kerja ────────────────────────────────────── */

  var cooAgent = findAgent(function (a) { return /^(COO|CEO|Direktur)\b/i.test(a.role || ''); });
  var srcLead = findAgent(function (a) { return a.divIndex === CONFIG.pipeline.source && isLeadRole(a) && a !== cooAgent; });
  var srcDiv = CONFIG.divisions[CONFIG.pipeline.source] || null;
  var targetDivs = CONFIG.divisions.map(function (d, i) { return i; }).filter(function (i) { return i !== CONFIG.pipeline.source; });
  var courierJobs = [];
  agents.forEach(function (a) {
    if (a.divIndex !== CONFIG.pipeline.source || a === cooAgent || a === srcLead) return;
    var di = targetDivs.length ? targetDivs[courierJobs.length % targetDivs.length] : -1;
    var lead = di >= 0 ? findAgent(function (x) { return x.divIndex === di && isLeadRole(x); }) : null;
    if (!lead) return;
    courierJobs.push({
      a: a, divIndex: di, div: CONFIG.divisions[di].short, lead: lead,

  if (srcLead) choreoIds[srcLead.id] = true;
  courierJobs.forEach(function (c) { choreoIds[c.a.id] = true; if (c.lead) choreoIds[c.lead.id] = true; });

  function leadTaskText(divIndex, kind) {

    // kalau tidak ada workflow, teks generik memakai nama divisi.
    var d = CONFIG.divisions[divIndex];

    if (wf) {

    } else if (p === 1) {

  /* ── Navigasi kamera: preset ruangan + tween halus ─────────────── */
  // preset kamera di-generate dari CONFIG: satu per ruangan + satu per lantai
  var VIEWS = {
    all: { pos: [17, 4 + NFLOORS * 5, 21], tgt: [0, NFLOORS * 0.9, -0.5] },

  roomsByFloor.forEach(function (rooms, fl) {
    rooms.forEach(function (r) {

      var y = fl * FH;
      VIEWS[key] = (r.kind === 'cyl') ? {
        pos: [TCX + 7.5, y + 4.2, 12.5], tgt: [TCX - 0.2, y + 0.4, -0.5]
      } : {
        pos: [r.cx + (r.cx < 0 ? -0.8 : 0.5), y + 3.7, 10.5],
        tgt: [r.cx + (r.cx < 0 ? -1.5 : 0.2), y + 0.4, r.div ? -0.3 : 0.6]
      };
    });
    VIEWS['floor-' + fl] = {
      pos: [0, fl * FH + 4.5, 19],
      tgt: [0, fl * FH + 0.8, 0]
    };
  });
  var camAnim = null;
  function goView(name) {
    var v = VIEWS[name];
    if (!v) return;
    if (REDUCED) {
      camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
      controls.target.set(v.tgt[0], v.tgt[1], v.tgt[2]);
      return;
    }
    camAnim = {
      t: 0, dur: 1.5,
      fromPos: camera.position.clone(), toPos: new THREE.Vector3(v.pos[0], v.pos[1], v.pos[2]),
      fromTg: controls.target.clone(), toTg: new THREE.Vector3(v.tgt[0], v.tgt[1], v.tgt[2])
    };
  }
  var chipBtns = document.querySelectorAll('#chips button');
  chipBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      chipBtns.forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      setPOV(null);
      goView(b.getAttribute('data-view'));
    });
  });
  controls.addEventListener('start', function () { camAnim = null; });


  /* ── POV Agent: kamera orang-pertama dari kepala agent ─────────
     Seret (drag) layar saat POV aktif untuk melihat sekeliling:
     povYaw/povPitch adalah offset arah pandang relatif terhadap arah
     hadap agent; saat belum pernah diseret, kamera mengikuti arah
     hadap / target agent seperti sebelumnya. */
  var povAgent = null;
  var povYaw = 0, povPitch = 0, povFree = false, povDrag = null;
  var povBtns = document.querySelectorAll('#povBar button[data-pov]');
  var povExitBtn = document.getElementById('povExit');
  var povHint = document.getElementById('povHint');
  function setPOV(id){
    povAgent = id ? (agentById[id] || null) : null;
    povYaw = 0; povPitch = 0; povFree = false; povDrag = null;
    povBtns.forEach(function(b){ b.classList.toggle('on', !!povAgent && b.getAttribute('data-pov')===id); });
    if (povExitBtn) povExitBtn.classList.toggle('show', !!povAgent);
    if (povHint) povHint.classList.toggle('show', !!povAgent);
    controls.enabled = !povAgent;
    if (povAgent) { camAnim = null; if (povAgent.bubbleEl) povAgent.bubbleEl.style.display='none'; }
  }
  povBtns.forEach(function(b){ b.addEventListener('click', function(){
    var id=b.getAttribute('data-pov');
    setPOV(povAgent && povAgent.id===id ? null : id);
  }); });
  if (povExitBtn) povExitBtn.addEventListener('click', function(){ setPOV(null); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') setPOV(null); });

  // Drag-look khusus POV (OrbitControls nonaktif selama POV, jadi tidak bentrok)
  renderer.domElement.addEventListener('pointerdown', function (e) {
    if (!povAgent) return;
    // Ambil alih mulus: hitung offset dari arah pandang kamera saat ini
    var dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    var curYaw = Math.atan2(dir.x, dir.z);
    povYaw = ((curYaw - povAgent.mesh.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    povPitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
    povFree = true;
    povDrag = { x: e.clientX, y: e.clientY };
    if (renderer.domElement.setPointerCapture && e.pointerId !== undefined) {
      try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  renderer.domElement.addEventListener('pointermove', function (e) {
    if (!povDrag || !povAgent) return;
    var dx = e.clientX - povDrag.x, dy = e.clientY - povDrag.y;
    povDrag.x = e.clientX; povDrag.y = e.clientY;
    povYaw -= dx * 0.0052;                    // seret kanan → menoleh kanan
    povPitch -= dy * 0.0052;                  // seret atas → melihat ke atas
    povPitch = Math.max(-1.15, Math.min(1.15, povPitch));
  });
  function endPovDrag() { povDrag = null; }
  renderer.domElement.addEventListener('pointerup', endPovDrag);
  renderer.domElement.addEventListener('pointercancel', endPovDrag);

  /* ── Klik aset 3D → kartu deskripsi on-demand ──────────────────── */
  var card = document.getElementById('card');
  var cardTitle = document.getElementById('cardTitle');
  var cardSub = document.getElementById('cardSub');
  var cardBody = document.getElementById('cardBody');
  var selectedInfo = null;
  document.getElementById('cardClose').addEventListener('click', function () {
    selectedInfo = null;
    card.classList.remove('open');
  });
  function showCard(info) {
    selectedInfo = info;
    var faceImg = document.getElementById('cardFace');
    if (info.agent) {
      if (faceImg && info.agent.face) { faceImg.src = info.agent.face; faceImg.alt = 'Wajah ' + info.agent.name; faceImg.style.display = 'block'; }
      else if (faceImg) faceImg.style.display = 'none';
      cardTitle.textContent = info.agent.name;
      cardSub.textContent = info.agent.role;
      cardBody.innerHTML = '';
      var s = document.createElement('span');
      s.className = 'live';
      s.textContent = 'Sedang: ';
      cardBody.appendChild(s);
      var v = document.createElement('span');
      v.id = 'cardLiveStatus';
      v.textContent = info.agent.status;
      cardBody.appendChild(v);
    } else {
      if (faceImg) faceImg.style.display = 'none';
      cardTitle.textContent = info.title;
      cardSub.textContent = info.sub;
      cardBody.textContent = info.body;
    }
    card.classList.add('open');
  }

  var raycaster = new THREE.Raycaster();
  var downX = 0, downY = 0;
  renderer.domElement.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; // itu drag, bukan klik
    var r = renderer.domElement.getBoundingClientRect();
    var nd = new THREE.Vector2(
      ((e.clientX - r.left) / r.width) * 2 - 1,
      -((e.clientY - r.top) / r.height) * 2 + 1
    );
    raycaster.setFromCamera(nd, camera);
    var hits = raycaster.intersectObjects(clickTargets, true);
    if (!hits.length) return;
    var obj = hits[0].object, info = null;
    while (obj) { if (obj.userData.click) { info = obj.userData.click; break; } obj = obj.parent; }
    if (!info) return;
    if (info.title === 'Boombox Lounge') toggleMusic();
    showCard(info);
  });

  /* ── Musik kantor: trek no-copyright (CONFIG.music) + synth lo-fi
     generatif via WebAudio sebagai fallback ────────────────────── */
  var musicBtn = document.getElementById('musicBtn');
  var musicLabel = document.getElementById('musicLabel');
  var AC = window.AudioContext || window.webkitAudioContext;
  var Music = {
    ctx: null, master: null, timer: null, nextTime: 0, chordIdx: 0, playing: false,
    audio: null, audioMode: false, audioFailed: false,
    chords: [
      { bass: 38, pad: [53, 57, 60, 64] },  // Dm9
      { bass: 34, pad: [50, 53, 57, 60] },  // Bbmaj7
      { bass: 41, pad: [53, 57, 60, 65] },  // Fmaj7
      { bass: 36, pad: [52, 55, 59, 62] }   // Cmaj7
    ],
    chordDur: 3.6,
    freq: function (midi) { return 440 * Math.pow(2, (midi - 69) / 12); },
    init: function () {
      var ctx = new AC();
      this.ctx = ctx;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2300; lp.Q.value = 0.4;
      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(lp); lp.connect(ctx.destination);
      var len = ctx.sampleRate * 1.2, buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
    },
    pad: function (t, chord) {
      var ctx = this.ctx, self = this;
      chord.pad.forEach(function (n) {
        [0, 5].forEach(function (det) {
          var o = ctx.createOscillator();
          o.type = 'triangle';
          o.frequency.value = self.freq(n);
          o.detune.value = det - 2.5;
          var g = ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.028, t + 0.9);
          g.gain.setValueAtTime(0.028, t + self.chordDur - 0.6);
          g.gain.linearRampToValueAtTime(0, t + self.chordDur + 0.5);
          o.connect(g); g.connect(self.master);
          o.start(t); o.stop(t + self.chordDur + 0.6);
        });
      });
      var b = ctx.createOscillator();
      b.type = 'sine'; b.frequency.value = this.freq(chord.bass);
      var bg = ctx.createGain();
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.11, t + 0.15);
      bg.gain.exponentialRampToValueAtTime(0.001, t + this.chordDur * 0.95);
      b.connect(bg); bg.connect(this.master);
      b.start(t); b.stop(t + this.chordDur);
    },
    pluck: function (t, midi) {
      var ctx = this.ctx;
      var o = ctx.createOscillator();
      o.type = 'triangle'; o.frequency.value = this.freq(midi);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.45);
    },
    hat: function (t) {
      var ctx = this.ctx;
      var src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      var hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 6500;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.012, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      src.connect(hp); hp.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + 0.06);
    },
    schedule: function () {
      while (this.nextTime < this.ctx.currentTime + 0.5) {
        var chord = this.chords[this.chordIdx % this.chords.length];
        this.pad(this.nextTime, chord);
        var stepDur = this.chordDur / 8;
        for (var s = 0; s < 8; s++) {
          if (s % 2 === 1) this.hat(this.nextTime + s * stepDur);
          if (Math.random() < 0.34) {
            var pool = chord.pad.map(function (n) { return n + 12; });
            this.pluck(this.nextTime + s * stepDur, pool[Math.floor(Math.random() * pool.length)]);
          }
        }
        this.nextTime += this.chordDur;
        this.chordIdx++;
      }
    },
    shortTitle: function () {
      var t = (CONFIG.music && CONFIG.music.title) || 'Musik kantor';
      return t.split(' — ')[0].split(' - ')[0];
    },
    // Trek audio (CONFIG.music.src): putar elemen <audio> (loop).
    // Gagal dimuat / autoplay ditolak → fallback ke synth.
    startAudio: function () {
      var self = this;
      if (!this.audio) {
        var a = new Audio();
        a.loop = true;
        a.preload = 'auto';
        a.volume = 0.55;
        a.src = CONFIG.music.src;
        a.addEventListener('error', function () {
          if (self.audioFailed) return;
          if (!self.playing && !self._audioStarting) return; // sudah dimatikan
          self.audioFailed = true;
          self.audioMode = false;
          self.startSynth();
        });
        this.audio = a;
      }
      this._audioStarting = true;
      var p = null;
      try { p = this.audio.play(); } catch (e) { p = null; }
      if (p && p.catch) {
        p.then(function () {
          self._audioStarting = false;
          if (self.audio.paused) return; // sudah dimatikan selagi menunggu
          self.playing = true;
          self.audioMode = true;
          musicBtn.classList.add('on');
          musicBtn.setAttribute('aria-pressed', 'true');
          musicLabel.textContent = '♪ ' + self.shortTitle();
          musicBtn.title = (CONFIG.music && CONFIG.music.credit) || '';
        }).catch(function () {
          self._audioStarting = false;
          self.audioFailed = true;
          self.startSynth();
        });
      } else {
        // browser lama tanpa promise — anggap jalan
        this._audioStarting = false;
        this.playing = true;
        this.audioMode = true;
        musicBtn.classList.add('on');
        musicBtn.setAttribute('aria-pressed', 'true');
        musicLabel.textContent = '♪ ' + this.shortTitle();
      }
    },
    // Synth lo-fi generatif (tanpa file eksternal — jalan offline).
    startSynth: function () {
      if (!AC) return;
      if (this.timer) clearInterval(this.timer);
      this.unlock();
      if (!this.ctx) return;
      var ctx = this.ctx;
      if (ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) {} }
      this.playing = true;
      this.audioMode = false;
      this.nextTime = ctx.currentTime + 0.1;
      this.chordIdx = 0;
      this.master.gain.cancelScheduledValues(ctx.currentTime);
      this.master.gain.setValueAtTime(this.master.gain.value, ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 0.6);
      var self = this;
      this.timer = setInterval(function () { self.schedule(); }, 160);
      musicBtn.classList.add('on');
      musicBtn.setAttribute('aria-pressed', 'true');
      musicLabel.textContent = '♪ Synth lo-fi';
    },
    stopSynth: function () {
      if (!this.ctx) return;
      var ctx = this.ctx;
      clearInterval(this.timer);
      this.master.gain.cancelScheduledValues(ctx.currentTime);
      this.master.gain.setValueAtTime(this.master.gain.value, ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.35);
      setTimeout(function () { if (!Music.playing && Music.ctx) Music.ctx.suspend(); }, 450);
    },
    stop: function () {
      this.playing = false;
      this.audioMode = false;
      this._audioStarting = false;
      if (this.audio) { try { this.audio.pause(); } catch (e) {} }
      this.stopSynth();
      musicBtn.classList.remove('on');
      musicBtn.setAttribute('aria-pressed', 'false');
      musicLabel.textContent = 'Musik kantor';
    },
    // Buka kunci audio DI DALAM handler klik/tap (kebijakan autoplay HP):
    // AudioContext dibuat/di-resume sinkron dari gestur pengguna, plus
    // buffer hening sesaat yang diputar ke destination agar jalur
    // keluaran benar-benar terbuka sebelum musik mulai.
    unlock: function () {
      if (!AC) return;
      if (!this.ctx) { try { this.init(); } catch (e) { return; } }
      var ctx = this.ctx;
      if (ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) {} }
      try {
        var b = ctx.createBuffer(1, 1, ctx.sampleRate);
        var srcNode = ctx.createBufferSource();
        srcNode.buffer = b;
        srcNode.connect(ctx.destination);
        srcNode.start(0);
      } catch (e) {}
    },
    toggle: function () {
      if (this.playing) { this.stop(); return; }
      this.unlock(); // gestur klik ini yang membuka kunci audio di HP
      var src = CONFIG.music && CONFIG.music.src;
      if (src && !this.audioFailed) { this.startAudio(); return; }
      this.startSynth();
    }
  };
  if (CONFIG.music && CONFIG.music.credit) musicBtn.title = CONFIG.music.credit;
  function toggleMusic() { Music.toggle(); }
  musicBtn.addEventListener('click', toggleMusic);
  window.__kantorMusic = Music; // handle uji: status putar & konteks audio
  boombox.userData.isBoombox = true;

  /* ── Resize & loop utama ────────────────────────────────────────── */
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var clock = new THREE.Clock();
  var clockT = 0;
  var projV = new THREE.Vector3();
  var liveStatusEl = null;

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;
    clockT = t;

    // tween kamera
    if (camAnim) {
      camAnim.t += dt / camAnim.dur;
      var k = camAnim.t >= 1 ? 1 : (1 - Math.pow(1 - camAnim.t, 3));
      camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, k);
      controls.target.lerpVectors(camAnim.fromTg, camAnim.toTg, k);
      if (camAnim.t >= 1) camAnim = null;
    }
    if (povAgent) {
      var pa = povAgent, rot = pa.mesh.rotation.y;
      var dx2 = Math.sin(rot), dz2 = Math.cos(rot);
      var headPos = new THREE.Vector3(pa.pos.x + dx2*0.28, pa.pos.y + 1.70, pa.pos.z + dz2*0.28);
      camera.position.lerp(headPos, 1 - Math.pow(0.0001, dt));
      var look;
      if (povFree) {
        // arah pandang bebas hasil drag, relatif terhadap arah hadap agent
        var ya = rot + povYaw, cp = Math.cos(povPitch);
        look = new THREE.Vector3(
          headPos.x + Math.sin(ya) * cp * 5,
          headPos.y + Math.sin(povPitch) * 5,
          headPos.z + Math.cos(ya) * cp * 5);
      } else {
        look = new THREE.Vector3(pa.pos.x + dx2*5, pa.pos.y + 1.52, pa.pos.z + dz2*5);
        if (pa.facePoint) look.set(pa.facePoint.x, pa.pos.y + 1.35, pa.facePoint.z);
        else if (pa.path && pa.path.length) { var np = pa.path[0]; look.set(np.x, pa.pos.y + 1.45, np.z); }
      }
      camera.lookAt(look);
      controls.target.copy(look);
    } else {
      controls.update();
    }
    controls.target.x = Math.max(-15, Math.min(15, controls.target.x));
    controls.target.y = Math.max(-0.5, Math.min(9, controls.target.y));
    controls.target.z = Math.max(-10, Math.min(10, controls.target.z));

    agents.forEach(function (a) { updateAgent(a, dt); });
    updateReserves(dt);

    // LED server berkedip
    for (var bi = 0; bi < blinkers.length; bi++) {
      var bl = blinkers[bi];
      bl.mat.emissiveIntensity = Math.sin(t * 2.6 + bl.seed * 2.3) > -0.25 ? 1.35 : 0.12;
    }
    // equalizer boombox + not melayang saat musik menyala
    var playing = Music.playing;
    for (var ei = 0; ei < eqBars.length; ei++) {
      eqBars[ei].scale.y = playing && !REDUCED ? 0.5 + Math.abs(Math.sin(t * 5.2 + ei * 1.63)) * 1.5 : 0.6;
    }
    notes.forEach(function (n) {
      var cyc = (t * 0.22 + n.phase) % 1;
      n.mesh.material.opacity = playing ? Math.sin(cyc * Math.PI) * 0.95 : 0;
      n.mesh.visible = playing;
      n.mesh.position.set(
        boombox.position.x + Math.sin(cyc * 5 + n.phase * 9) * 0.35,
        boombox.position.y + 1.15 + cyc * 1.5,
        boombox.position.z + Math.cos(cyc * 4 + n.phase * 7) * 0.3
      );
      n.mesh.rotation.y = t * 1.5 + n.phase * 6;
    });

    renderer.render(scene, camera);

    // proyeksi chat bubble mengikuti kepala agent
    var w = stage.clientWidth, h = stage.clientHeight;
    agents.forEach(function (a) {
      if (a.lastStatus !== a.status) {
        a.lastStatus = a.status;
        a.bubbleText.textContent = a.status;
      }
      if (bubblesHidden) { a.bubbleEl.style.display = 'none'; return; }
      if (povAgent && a.id === povAgent.id) { a.bubbleEl.style.display = 'none'; return; }
      projV.copy(a.pos);
      projV.y += 2.18;
      projV.project(camera);
      if (projV.z > 1 || projV.z < -1) { a.bubbleEl.style.display = 'none'; return; }
      a.bubbleEl.style.display = 'block';
      var sx = (projV.x * 0.5 + 0.5) * w;
      var sy = (-projV.y * 0.5 + 0.5) * h;
      a.bubbleEl.style.transform = 'translate(-50%,-100%) translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px)';
    });

    // status live pada kartu agent yang sedang terbuka
    if (selectedInfo && selectedInfo.agent) {
      if (!liveStatusEl || !liveStatusEl.isConnected) liveStatusEl = document.getElementById('cardLiveStatus');
      if (liveStatusEl && liveStatusEl.textContent !== selectedInfo.agent.status) {
        liveStatusEl.textContent = selectedInfo.agent.status;
      }
    }
  }
  // handle debug (untuk pengujian otomatis): hitung agen, ruangan, kursi
  window.__kantor3d = {
    floors: NFLOORS,
    shape: 'persegi+silinder',
    stairs: 'A-badan-kotak + B-menara-silinder (tidak sejajar)',
    reserves: reserveAgents.length,
    views: Object.keys(VIEWS),
    agents: agents.map(function (a) { return { id: a.id, name: a.name, divIndex: a.divIndex, seat: { x: +a.seat.x.toFixed(2), z: +a.seat.z.toFixed(2), floor: a.seat.floor } }; }),
    rooms: roomsByFloor.map(function (rooms, fl) {
      return rooms.map(function (r) {
        return { div: r.div ? r.div.short : 'Lounge', divIndex: r.divIndex, floor: fl, x0: +r.x0.toFixed(2), x1: +r.x1.toFixed(2), desks: (r.desks || []).length, agents: r.agentCount };
      });
    })
  };
  frame();
})();
</script>
</body>
</html>
